name: engine parity

# The native and WebAssembly builds of XIXScoring must produce identical RoundResult JSON for every
# fixture (Build Doc 2 B.3). This is what lets the app trust its local engine against the server's.
on:
  workflow_dispatch:
  push:
    paths: ["XIXScoring/**", "scripts/**", "supabase/functions/xix-engine/**", ".github/workflows/engine-parity.yml"]
  pull_request:
    paths: ["XIXScoring/**", "scripts/**", "supabase/functions/xix-engine/**", ".github/workflows/engine-parity.yml"]

jobs:
  parity:
    runs-on: ubuntu-24.04
    env:
      SWIFT_VERSION: 6.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Toolchain system dependencies (Ubuntu 24.04)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev
      - name: Install swiftly and Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -sSfL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar xz
          ./swiftly init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/swiftly/bin:$PATH"
          swiftly install "$SWIFT_VERSION" --use --assume-yes
          swift --version
      - name: Install the matching Wasm SDK
        run: |
          swift sdk install "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
          swift sdk list
      - name: Unit tests and fixtures (native)
        run: swift test --package-path XIXScoring
      - name: Native vs Wasm parity on every fixture
        run: ./scripts/engine-parity.sh
      # The edge function carries the sha256 of the module it ships with, which is what stops a
      # rebuilt engine deploying as "no change found". If a commit changes the engine without
      # restamping, the two are already out of step in the repository, and a deploy from it would put
      # a stale module on the project. So: build the module here and check the stamp against it.
      - name: The stamped module hash matches a fresh build
        run: |
          ./scripts/build-engine-wasm.sh >/dev/null
          FRESH="$(shasum -a 256 supabase/functions/xix-engine/xix-engine-cli.wasm | cut -d" " -f1)"
          STAMPED="$(grep -oE 'ENGINE_MODULE_SHA = "[0-9a-f]{64}"' supabase/functions/xix-engine/index.ts | grep -oE '[0-9a-f]{64}')"
          echo "fresh   $FRESH"
          echo "stamped $STAMPED"
          if [ "$FRESH" != "$STAMPED" ]; then
            echo "::error file=supabase/functions/xix-engine/index.ts::index.ts is stamped with $STAMPED but this engine builds $FRESH. Run 'make wasm' and commit index.ts."
            exit 1
          fi
          # And the build must leave nothing else uncommitted.
          if ! git diff --quiet -- supabase/functions/xix-engine/index.ts; then
            echo "::error::building the module changed index.ts; commit the restamped file"
            git --no-pager diff -- supabase/functions/xix-engine/index.ts
            exit 1
          fi

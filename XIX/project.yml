# The XIX app target (Build Doc 3 step 1). Generate the project with `make app` (xcodegen); the
# .xcodeproj is a build product and is not committed. Debug points at the local Supabase stack, Release
# at the shared project (XIX/Config/Shared.xcconfig, generated from the CLI, never committed).
name: XIX
options:
  bundleIdPrefix: golf.xix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  XIXUI:
    path: ../XIXUI
  XIXData:
    path: ../XIXData
  XIXScoring:
    path: ../XIXScoring
  XIXModels:
    path: ../XIXModels
targets:
  XIX:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: XIXUI
      - package: XIXData
      - package: XIXScoring
      - package: XIXModels
    entitlements:
      path: XIX.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:xix.golf"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: XIX
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: golf.xix.app
            CFBundleURLSchemes: [xix]
        XIXLocalURL: $(XIX_LOCAL_URL)
        XIXLocalAnonKey: $(XIX_LOCAL_ANON_KEY)
        XIXSharedURL: $(XIX_SHARED_URL)
        XIXSharedAnonKey: $(XIX_SHARED_ANON_KEY)
        XIXDefaultBackend: $(XIX_DEFAULT_BACKEND)
    scheme:
      testTargets: [XIXUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: golf.xix.app
        DEVELOPMENT_TEAM: P4V33834SQ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false
  XIXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: XIX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: golf.xix.app.uitests
        DEVELOPMENT_TEAM: P4V33834SQ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: XIX
        GENERATE_INFOPLIST_FILE: true
